{% extends "spoor/base.html" %}

{% block title %}Log in | Spoor{% endblock %}

{% block content %}
  <h1>Log in</h1>
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
{% endblock %}
